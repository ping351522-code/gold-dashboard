<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurum Trade - Sign Up</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #121418; color: #e1e3e6; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .signup-card { background-color: #1a1d24; border: 1px solid #2a2e39; border-radius: 16px; width: 100%; max-width: 440px; padding: 35px 30px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); }
        .brand-header { text-align: center; margin-bottom: 25px; }
        .brand-header i { font-size: 2.2rem; color: #d4af37; margin-bottom: 8px; }
        .brand-header h2 { color: #d4af37; font-size: 1.4rem; }
        .brand-header p { color: #8a8f9d; font-size: 0.85rem; margin-top: 4px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; color: #8a8f9d; font-size: 0.82rem; margin-bottom: 6px; }
        .input-container { position: relative; }
        .input-container i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #6c727f; }
        .input-container input { width: 100%; background-color: #242832; border: 1px solid #323745; padding: 11px 14px 11px 42px; border-radius: 8px; color: #fff; outline: none; font-size: 0.9rem; }
        .terms { display: flex; align-items: center; gap: 8px; color: #8a8f9d; font-size: 0.8rem; margin: 18px 0; }
        .terms input { accent-color: #d4af37; }
        .btn-signup { width: 100%; background: linear-gradient(135deg, #d4af37 0%, #aa820a 100%); color: #000; font-weight: 700; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 0.95rem; }
        .divider { text-align: center; margin: 20px 0; position: relative; }
        .divider::before { content: ""; position: absolute; left: 0; top: 50%; width: 100%; height: 1px; background-color: #2a2e39; }
        .divider span { background-color: #1a1d24; padding: 0 10px; color: #6c727f; font-size: 0.75rem; position: relative; }
        .social-signup { display: flex; gap: 10px; }
        .btn-social { flex: 1; background-color: #242832; border: 1px solid #323745; color: #fff; padding: 9px; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; font-size: 0.85rem; }
        .login-link { text-align: center; margin-top: 20px; font-size: 0.85rem; color: #8a8f9d; }
        .login-link a { color: #d4af37; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="signup-card">
        <div class="brand-header">
            <i class="fa-solid fa-coins"></i>
            <h2>AURUM TRADE</h2>
            <p>Create your free account today</p>
        </div>
        <form>
            <div class="form-group">
                <label>Full Name</label>
                <div class="input-container"><i class="fa-regular fa-user"></i><input type="text" placeholder="John Doe"></div>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <div class="input-container"><i class="fa-regular fa-envelope"></i><input type="email" placeholder="name@example.com"></div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-container"><i class="fa-solid fa-lock"></i><input type="password" placeholder="Create password"></div>
            </div>
            <label class="terms"><input type="checkbox"> I agree to the Terms & Privacy Policy</label>
            <button type="submit" class="btn-signup">CREATE ACCOUNT</button>
        </form>
        <div class="divider"><span>OR</span></div>
        <div class="social-signup">
            <button class="btn-social"><i class="fa-brands fa-google" style="color:#ea4335;"></i> Google</button>
            <button class="btn-social"><i class="fa-brands fa-apple"></i> Apple</button>
        </div>
        <div class="login-link">Already have an account? <a href="#">Log In</a></div>
    </div>
</body>
</html>
